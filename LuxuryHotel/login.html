<style>

        height: 100%;
        margin: 0;
        font-family: 'Times New Roman', serif;
        background-color: #332c1f;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: white;
    }


    .titulo {
        font-size: 28px;
        margin: 20px 40px;
    }


    .login-container {
        display: flex;
        background-color: #eaeaea;
        width: 800px;
        height: 600px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);

    .login-form {
        flex: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .login-form h2 {
        color: #9b7342;
        margin-bottom: 20px;
        font-weight: normal;
    }

    .login-form input {
        width: 250px;
        height: 40px;
        margin: 10px 0;
        padding: 5px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    .login-form a {
        font-size: 12px;
        color: #aaa;
        text-decoration: none;
        margin-bottom: 20px;
    }


    .login-form button {
        background-color: rgb(53, 53, 53);
        color: white;
        font-family: 'Times New Roman', serif;
        font-size: 18px;
        border: none;
        padding: 10px 30px;
        border-radius: 25px;
        cursor: pointer;
    }


    .side-panel {
        flex: 1;
        background-color: #996633;
    }
    header {
      background-color: #0a0903;
      padding: 10px 30px;
    }

    .logo-container {
      display: flex;
      justify-content: center; /* Centraliza a logo */
      align-items: center;
      width: 100%;
      padding: 10px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: white;
      justify-content: center;
    }

    .logo img {
      height: 35px; /* Logo menor */
      margin-right: 10px;
    }

      font-size: 22px;
      font-weight: bold;
      margin: 0;
    }
