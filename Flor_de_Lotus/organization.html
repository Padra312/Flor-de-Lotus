<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link href="assets/img/logo.png" rel="icon">
    <link href="assets/img/logo.png" rel="apple-touch-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;

        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        .header {
            background-color: #111111;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            min-height: 150px;
        }

        h1 {
            color: #e9e9e9;
            text-align: center;
            margin-bottom: 20px;
        }

        .button-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            transition: all 0.3s ease;
        }

        .create-btn {
            background-color: #FFD700;
            color: black;
        }

        .create-btn:hover {
            background-color: #e0bf00;
        }

        .filter-btn {
            background-color: #FFD700;
            color: black;
        }

        .filter-btn:hover {
            background-color: #e0bf00;
        }

        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        @media (max-width:600px) {
            header {
                flex-direction: column;
                text-align: center;
                margin: 0px;
            }

        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Agendamento de Massagens</h1>
        <div class="button-container">
            <button class="filter-btn">Filtrar</button>
            <button class="create-btn">Agendados</button>
        </div>
    </div>

    <div class="form-container" id="formContainer">
        <h2 class="form-title">Novo Agendamento</h2>
        <div class="form-group">
            <label for="name">Nome:</label>
            <input type="text" id="name" placeholder="Digite o nome completo">
        </div>
        <div class="form-group">
            <label for="age">Idade:</label>
            <input type="number" id="age" placeholder="Digite a idade">
        </div>
        <div class="form-group">
            <label for="date">Data:</label>
            <input type="date" id="date">
        </div>
        <div class="form-group">
            <label for="time">Hora:</label>
            <input type="time" id="time">
        </div>
        <div class="form-group">
            <label for="massageType">Tipo de Massagem:</label>
            <select id="massageType">
                <option value="">Selecione o tipo de massagem</option>
                <option value="placeholder">placeholder</option>
                <option value="placeholder">placeholder</option>
                <option value="placeholder">placeholder</option>
                <option value="placeholder">placeholder</option>
                <option value="placeholder">placeholder</option>
            </select>
        </div>
        <button class="create-btn">Agendar</button>
    </div>
</body>
</html>
