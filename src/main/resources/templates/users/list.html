<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="UTF-8">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
   <title>Lista de Usuários</title>
</head>
<body>
   <!-- Barra de Navegação com Logout -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
	<div class="container">
				<a class="navbar-brand" th:href="@{/massagens}">Sistema</a>

				<div class="navbar-nav me-auto">
					<a class="nav-link" th:href="@{/massagens}">Consultas</a> 
					<a class="nav-link" th:href="@{/categories}">Massagem</a>
					<a class="nav-link" th:href="@{/profissionais}">Profissional</a>
					<a class="nav-link active" th:href="@{/users}">Usuários</a>
				</div>
          
           <div class="navbar-nav ms-auto">
               <span class="navbar-text text-light me-3">
                   <i class="bi bi-person"></i>
                   <span th:text="${session.userLogged.nome} ?: 'Usuário'"></span>
               </span>
               <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">
                   <i class="bi bi-box-arrow-right"></i> Sair
               </a>
           </div>
       </div>
   </nav>
   <div class="container">
   <!-- 🔍 FORMULÁRIO DE BUSCA -->
       <div class="card mb-4">
           <div class="card-header bg-secondary text-white">
               <i class="bi bi-search"></i> Buscar Produtos
           </div>
           <div class="card-body">
               <form th:action="@{/users/buscar}" method="get" class="row g-3">
                   <div class="col-md-8">
                       <input type="text"
                              name="nome"
                              class="form-control"
                              placeholder="Digite o nome do produto..."
                              th:value="${termoBuscado}">
                   </div>
                   <div class="col-md-4">
                       <button type="submit" class="btn btn-primary me-2">
                           <i class="bi bi-search"></i> Buscar
                       </button>
                       <a th:href="@{/users}" class="btn btn-secondary">
                           <i class="bi bi-x-circle"></i> Limpar
                       </a>
                   </div>
               </form>
           </div>
       </div>
       <!-- Cabeçalho -->
       <div class="d-flex justify-content-between align-items-center mb-4">
           <h1><i class="bi bi-people"></i> Usuários Cadastrados</h1>
           <div>
               <a th:href="@{/products}" class="btn btn-primary me-2">
                   <i class="bi bi-box"></i> Ver Produtos
               </a>
               <a th:href="@{/users/new}" class="btn btn-success">
                   <i class="bi bi-person-plus"></i> Novo Usuário
               </a>
           </div>
       </div>
       <!-- Tabela de Usuários -->
       <table class="table table-striped table-hover">
           <thead class="table-dark">
               <tr>
                   <th>ID</th>
                   <th>Nome</th>
                   <th>Email</th>
                   <th>Ações</th>
               </tr>
           </thead>
           <tbody>
               <tr th:each="user : ${users}">
                   <td th:text="${user.id}"></td>
                   <td th:text="${user.nome}"></td>
                   <td th:text="${user.email}"></td>
                   <td>
                       <!-- Botão Editar -->
                       <a th:href="@{/users/edit/{id}(id=${user.id})}"
                          class="btn btn-sm btn-warning me-2">
                           <i class="bi bi-pencil"></i> Editar
                       </a>
                      
                       <!-- Botão Excluir -->
                       <a th:href="@{/users/delete/{id}(id=${user.id})}"
                          class="btn btn-sm btn-danger"
                          onclick="return confirm('Tem certeza que deseja excluir este usuário?')">
                           <i class="bi bi-trash"></i> Excluir
                       </a>
                   </td>
               </tr>
              
               <!-- Mensagem se não houver usuários -->
               <tr th:if="${users.empty}">
                   <td colspan="4" class="text-center text-muted">
                       <i class="bi bi-database-exclamation"></i>
                       Nenhum usuário cadastrado.
                       <a th:href="@{/users/new}">Clique aqui para criar o primeiro.</a>
                   </td>
               </tr>
           </tbody>
       </table>
   </div>
   <!-- Scripts Bootstrap -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
