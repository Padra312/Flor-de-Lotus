<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet">
<title>Cadastrar Usuário</title>
</head>
<body>
	<div class="container mt-4">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<!-- Cabeçalho -->
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h1>Cadastrar Novo Usuário</h1>
					<!-- Logo abaixo do <h1> -->
					<div th:if="${error}"
						class="alert alert-danger alert-dismissible fade show">
						<i class="bi bi-exclamation-triangle"></i> <span
							th:text="${error}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
					</div>
					<a th:href="@{/users}" class="btn btn-secondary"> <i
						class="bi bi-arrow-left"></i> Voltar
					</a>
				</div>
				<!-- Formulário -->
				<form th:action="@{/users/save}" th:object="${user}" method="post">
					<!-- Campo Nome -->
					<div class="mb-3">
						<label class="form-label">Nome *</label> <input type="text"
							class="form-control" th:field="*{nome}"
							placeholder="Digite o nome completo" required>
						<div class="text-danger" th:if="${#fields.hasErrors('nome')}"
							th:errors="*{nome}">Erro no nome</div>
					</div>
					<!-- Campo Email -->
					<div class="mb-3">
						<label class="form-label">Email *</label> <input type="email"
							class="form-control" th:field="*{email}"
							placeholder="exemplo@email.com" required>
						<div class="text-danger" th:if="${#fields.hasErrors('email')}"
							th:errors="*{email}">Erro no email</div>
					</div>
					<!-- Campo Senha -->
					<div class="mb-3">
						<label class="form-label">Senha *</label> <input type="password"
							class="form-control" th:field="*{senha}"
							placeholder="Pense em uma senha dificil" required>
						<div class="text-danger" th:if="${#fields.hasErrors('senha')}"
							th:errors="*{senha}">Erro na senha</div>
					</div>
					<!-- Botões -->
					<div class="d-grid gap-2 d-md-flex justify-content-md-end">
						<button type="submit" class="btn btn-primary">
							<i class="bi bi-check-circle"></i> Salvar
						</button>
						<a th:href="@{/users}" class="btn btn-secondary"> <i
							class="bi bi-x-circle"></i> Cancelar
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>
	<!-- Bootstrap Icons -->
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
