<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Fundo com imagem de lótus e leve filtro dourado */
    body {
      background: 
        linear-gradient(rgba(145, 122, 90, 0.45), rgba(145, 122, 90, 0.45)),
        url('https://cdn.pixabay.com/photo/2017/07/25/19/19/lotus-2539498_1280.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Poppins', sans-serif;
      color: #32220b;
    }

    /* Container principal */
    .login-container {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.25);
      margin-top: 80px;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease-in-out, box-shadow 0.3s ease-in-out;
    }

    .login-container:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.35);
    }

    h2 {
      color: #917a5a;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
    }

    label {
      color: #32220b;
      font-weight: 500;
    }

    /* Botão principal - dourado queimado */
    .btn-custom {
      background-color: #917a5a;
      color: #fff;
      font-weight: 600;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #a58b6c;
      transform: scale(1.03);
    }

    /* Botão contornado */
    .btn-outline-custom {
      border: 2px solid #917a5a;
      color: #917a5a;
      font-weight: 600;
      background-color: transparent;
      transition: all 0.3s ease;
    }

    .btn-outline-custom:hover {
      background-color: #917a5a;
      color: #fff;
      transform: scale(1.03);
    }

    /* Campos de texto */
    .form-control {
      border-radius: 10px;
      border: 1px solid #c2b8a3;
    }

    .form-control:focus {
      border-color: #917a5a;
      box-shadow: 0 0 0 0.25rem rgba(145, 122, 90, 0.25);
    }

    /* Alertas */
    .alert {
      text-align: left;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4 login-container text-center">
        <h2 class="mb-4">Login</h2>

        <div th:if="${param.logout}" class="alert alert-success">
          Você foi desconectado com sucesso!
        </div>
        <div th:if="${param.error}" class="alert alert-danger">
          Email ou senha inválidos!
        </div>

        <form th:action="@{/login}" method="post">
          <div class="mb-3 text-start">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-custom w-100 mb-3">Entrar</button>
        </form>

        <!-- Botão para registro -->
        <a th:href="@{/users/register}" class="btn btn-outline-custom w-100">Criar conta</a>
      </div>
    </div>
  </div>
</body>
</html>
