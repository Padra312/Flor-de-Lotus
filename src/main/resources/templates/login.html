<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet">
<title>Login</title>
</head>
<body>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-4">
				<h2 class="text-center mb-4">Login</h2>
				<!-- Adicione isso abaixo do título -->
				<div th:if="${param.logout}" class="alert alert-info">
					<i class="bi bi-info-circle"></i> Você foi desconectado com sucesso!
				</div>
				<div th:if="${param.error}" class="alert alert-danger">
					<i class="bi bi-exclamation-triangle"></i> Email ou senha inválidos!
				</div>
				<div th:if="${param.error}" class="alert alert-danger">Email
					ou senha inválidos!</div>
				<form th:action="@{/login}" method="post">
					<div class="mb-3">
						<label class="form-label">Email</label> <input type="email"
							name="email" class="form-control" required>
					</div>
					<div class="mb-3">
						<label class="form-label">Senha</label> <input type="password"
							name="senha" class="form-control" required>
					</div>
					<button type="submit" class="btn btn-primary w-100">Entrar</button>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
