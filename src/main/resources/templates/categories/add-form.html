<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="UTF-8">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
   <title>Nova Massagem</title>
</head>
<body>
   <div class="container mt-4">
       <div class="row justify-content-center">
           <div class="col-md-6">
              
               <!-- Cabeçalho -->
               <div class="d-flex justify-content-between align-items-center mb-4">
                   <h1>Massagem</h1>
                   <a th:href="@{/categories}" class="btn btn-secondary">
                       ← Voltar
                   </a>
               </div>
               <!-- Mensagens de Erro -->
               <div th:if="${error != null}" class="alert alert-danger">
                   <i class="bi bi-exclamation-triangle"></i>
                   <span th:text="${error}"></span>
               </div>
               <!-- Formulário SIMPLES - sem th:object inicialmente -->
               <form th:action="@{/categories/save}" method="post">
                  
                   <!-- Campo Nome -->
                   <div class="mb-3">
                       <label class="form-label">Nome da Massagem *</label>
                       <input type="text"
                              class="form-control"
                              name="nome"

                              required
                              minlength="2">
                   </div>
				   <!-- Campo Descrição -->
				                     <div class="mb-3">
				                         <label class="form-label">Descrição</label>
				                         <textarea class="form-control"
				                                   name="descricao"
				                                   rows="3"
				                                   placeholder="Digite a descrição da massagem..."
				                                   th:text="${category.descricao}"></textarea>
				                     </div>

				                     <!-- Campo URL da Imagem -->
				                     <div class="mb-3">
				                         <label class="form-label">URL da Imagem</label>
				                         <input type="text"
				                                class="form-control"
				                                name="imagemUrl"
				                                placeholder="Ex: https://exemplo.com/imagem.jpg"
				                                th:value="${category.imagemUrl}">
				                     </div>

				                     <!-- Pré-visualização da imagem -->
				                     <div class="text-center mb-3" th:if="${category.imagemUrl != null}">
				                         <img th:src="${category.imagemUrl}"
				                              alt="Imagem da Massagem"
				                              class="img-fluid rounded shadow-sm"
				                              style="max-height: 200px;">
				                     </div>
				   
                   <!-- Botões -->
                   <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                       <button type="submit" class="btn btn-primary">
                           <i class="bi bi-plus-circle"></i> Criar Massagem
                       </button>
                       <a th:href="@{/categories}" class="btn btn-secondary">Cancelar</a>
                   </div>
               </form>
           </div>
       </div>
   </div>
   <!-- Bootstrap Icons -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
