<head>
    <meta charset="UTF-8">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
   <title>Editar Massagem</title>
</head>
<body>
   <div class="container mt-4">
       <h1>Editar Massagem</h1>
       <form th:action="@{/massagens/update/{id}(id=${massage.idMassagem})}"
             th:object="${massage}" method="post">
             <!-- Campo oculto para o ID -->
			 <input type="hidden" th:field="*{idMassagem}">

			 <label class="form-label">Cliente</label>
			 <input type="text" class="form-control" th:field="*{descricao}" required>

			 <label class="form-label">Massagem *</label>
			 <select class="form-select" th:field="*{categoria}" required>
			     <option value="">Selecione uma categoria...</option>
			     <option th:each="cat : ${categories}" th:value="${cat.id}"
			         th:selected="${massage.categoria != null and massage.categoria.id == cat.id}"
			         th:text="${cat.nome}"></option>
			 </select>

			 <label class="form-label mt-3">Profissional *</label>
			 <select class="form-select" th:field="*{profissional.idProfissional}" required>
			     <option value="">Selecione o profissional...</option>
			     <option th:each="p : ${profissionais}" th:value="${p.idProfissional}" th:text="${p.nome}"></option>
			 </select>

			 <label class="form-label mt-3">Dia *</label>
			 <input type="date" class="form-control" th:field="*{dia}" required>

			 <label class="form-label mt-3">Hora *</label>
			 <input type="time" class="form-control" th:field="*{hora}" required>

			 <label class="form-label mt-3">Valor</label>
			 <input type="number" step="0.01" class="form-control" th:field="*{valor}" required>

               
           <button type="submit" class="btn btn-primary mt-5">Atualizar</button>
           <a th:href="@{/massagens}" class="btn btn-secondary ms-2 mt-5">Cancelar</a>
       </form>
   </div>
</body>
</html>
