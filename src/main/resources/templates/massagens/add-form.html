<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Nova Consulta</title>
</head>
<body>
    <main class="container mt-4">
        <h1>Consulta</h1>
        <form th:action="@{/massagens/save}" th:object="${massage}" method="post">
           
			<label class="form-label">Nome do cliente</label>
			               <input type="text" class="form-control" th:field="*{descricao}" required>
			
			<label class="form-label">Massagem *</label> <select
								class="form-select" th:field="*{categoria}" required>
								<option value="">Selecione uma massagem...</option>
								<option th:each="cat : ${categories}" th:value="${cat.id}"
									th:text="${cat.nome}"></option>
							</select>
							<div class="text-danger" th:if="${#fields.hasErrors('categoria')}"
								th:errors="*{categoria}"></div>
			
								<label class="form-label mt-3">Profissional *</label>
								<select class="form-select" th:field="*{profissional.idProfissional}" required>
								    <option value="">Selecione o profissional...</option>
								    <option th:each="p : ${profissionais}" 
								            th:value="${p.idProfissional}" 
								            th:text="${p.nome}"></option>
								</select>


               
                <label class="form-label">Valor</label>
                <input type="number" step="0.01" class="form-control" th:field="*{valor}" required>
             <label class="form-label">URL da Imagem</label>
				<input type="text" class="form-control" th:field="*{imagemUrl}"
				placeholder="https://exemplo.com/imagem.jpg ou nome-do-arquivo.jpg">
			<div class="form-text">Digite a URL completa da imagem ou
				apenas o nome do arquivo se for fazer upload</div>
             
            <!-- Outros campos aqui -->
            <button type="submit" class="btn btn-primary mt-5">Salvar</button>
            <a th:href="@{/massagens}" class="btn btn-secondary ms-2 mt-5">Cancelar</a> 
        </form>
    </main>
</body>
</html>

</body>
</html>
