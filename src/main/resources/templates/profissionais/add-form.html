<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="UTF-8">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
   <title>Nova Categoria</title>
</head>
<body>
   <div class="container mt-4">
       <div class="row justify-content-center">
           <div class="col-md-6">
              
               <!-- Cabeçalho -->
               <div class="d-flex justify-content-between align-items-center mb-4">
                   <h1>Novo Profissional </h1>
                   <a th:href="@{/profissionais}" class="btn btn-secondary">
                       ← Voltar
                   </a>
               </div>
               <!-- Mensagens de Erro -->
               <div th:if="${error != null}" class="alert alert-danger">
                   <i class="bi bi-exclamation-triangle"></i>
                   <span th:text="${error}"></span>
               </div>
               <!-- Formulário SIMPLES - sem th:object inicialmente -->
               <form th:action="@{/profissionais/save}" method="post">
                  
                   <!-- Campo Nome -->
                   <div class="mb-3">
                       <label class="form-label">Nome do profissional *</label>
                       <input type="text"
                              class="form-control"
                              name="nome"
                              required
                              minlength="2">
                   </div>
                   <!-- Botões -->
                   <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                       <button type="submit" class="btn btn-primary">
                           <i class="bi bi-plus-circle"></i> Registrar um profissional
                       </button>
                       <a th:href="@{/profissionais}" class="btn btn-secondary">Cancelar</a>
                   </div>
               </form>
           </div>
       </div>
   </div>
   <!-- Bootstrap Icons -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
