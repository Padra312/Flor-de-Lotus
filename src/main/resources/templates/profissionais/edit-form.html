<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="UTF-8">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
   <title>Editar Categoria</title>
</head>
<body>
   <div class="container mt-4">
       <div class="row justify-content-center">
           <div class="col-md-6">
              
               <!-- Cabeçalho -->
               <div class="d-flex justify-content-between align-items-center mb-4">
                   <h1>✏️ Editar Categoria</h1>
                   <a th:href="@{/profissionais}" class="btn btn-secondary">
                       ← Voltar
                   </a>
               </div>
               <!-- Mensagens de Erro -->
               <div th:if="${error != null}" class="alert alert-danger">
                   <i class="bi bi-exclamation-triangle"></i>
                   <span th:text="${error}"></span>
               </div>
               <!-- Formulário SIMPLES -->
               <form th:action="@{/profissionais/update/{id}(id=${category.id})}" method="post">
                  
                   <!-- Campo ID (oculto) -->
                   <input type="hidden" name="id" th:value="${category.id}">
                  
                   <!-- Campo Nome -->
                   <div class="mb-3">
                       <label class="form-label">Nome da Categoria *</label>
                       <input type="text"
                              class="form-control"
                              name="nome"
                              th:value="${category.nome}"
                              placeholder="Ex: Material Escolar"
                              required
                              minlength="2">
                   </div>
                   <!-- Informações -->
                   <div class="card mb-3">
                       <div class="card-body">
                           <h6>Informações:</h6>
                           <p class="mb-1">ID: <strong th:text="${category.id}"></strong></p>
                           <p class="mb-0">Massagens vinculados: <strong th:text="${category.massagens.size()}"></strong></p>
                       </div>
                   </div>
                   <!-- Botões -->
                   <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                       <button type="submit" class="btn btn-primary">
                           <i class="bi bi-check-circle"></i> Atualizar
                       </button>
                       <a th:href="@{/profissionais}" class="btn btn-secondary">Cancelar</a>
                   </div>
               </form>
           </div>
       </div>
   </div>
   <!-- Bootstrap Icons -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
